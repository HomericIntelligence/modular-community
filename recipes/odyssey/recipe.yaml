context:
  version: "0.2.0"
  mojo_version: "=1.0.0"

package:
  name: "odyssey"
  version: ${{ version }}

source:
  - git: https://github.com/HomericIntelligence/Odyssey
    rev: v0.2.0

build:
  number: 0
  script:
    - mkdir -p ${PREFIX}/lib/mojo
    - mojo package -I src src/odyssey -o ${PREFIX}/lib/mojo/odyssey.mojopkg

requirements:
  build:
    - mojo-compiler ${{ mojo_version }}
  host:
    - mojo-compiler ${{ mojo_version }}
  run:
    - mojo-compiler ${{ mojo_version }}

tests:
  - script:
      - if: unix
        then:
          - mojo run -I ${PREFIX}/lib/mojo conda.recipe/test_import.mojo
    requirements:
      run:
        - mojo-compiler ${{ mojo_version }}
    files:
      source:
        - conda.recipe/test_import.mojo

about:
  homepage: https://github.com/HomericIntelligence/Odyssey
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Mojo-based AI research platform for reproducing classic research papers. Provides reusable tensor ops, autograd, layers, optimizers, and training infrastructure. v0.2.0 is the Mojo 1.0.0 stable port (renamed from ProjectOdyssey; module namespace `odyssey`).
  repository: https://github.com/HomericIntelligence/Odyssey.git

extra:
  project_name: odyssey
  maintainers:
    - mvillmow